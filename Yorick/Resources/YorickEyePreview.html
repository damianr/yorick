          for(let k=0;k<=100;k++){
            const a=k/100*Math.PI*2;
            const ripple=(Math.sin(a*5-t*4+ring*.9)*.5+Math.sin(a*3+t*2)*.5)*v*(ring===2?9:4);
            const r=radius-ring*14+ripple+v*ring*2;
            const px=centerX+Math.cos(a)*r,py=centerY+Math.sin(a)*r;
            if(k===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
          }
          ctx.closePath();ctx.strokeStyle=['#72cbe7','#338fbc','#a4e7e9'][ring];ctx.lineWidth=[4,8,3][ring];ctx.stroke();
        }
        for(let k=0;k<24;k++){
          const a=k/24*Math.PI*2, r=radius-4;
          ctx.strokeStyle='#b6f3fa5f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(centerX+Math.cos(a)*(r-5),centerY+Math.sin(a)*(r-5));ctx.lineTo(centerX+Math.cos(a)*r,centerY+Math.sin(a)*r);ctx.stroke();
        }
        ellipse(ctx,centerX,centerY,26+v*4,26+v*4,'#02070b');
        ellipse(ctx,centerX-18,centerY-25,6,6,'#e7ffffb8');
        ctx.globalAlpha=1;
        const top=120-105*openness,bottom=120+105*openness;
        ctx.fillStyle='#030708';ctx.fillRect(0,0,240,Math.max(0,top));ctx.fillRect(0,bottom,240,240-bottom);
      }
      // Circular aperture masks the outer 16 pixels of each 240px display.
      ctx.restore();
      return;
    }

function frame(now){requestAnimationFrame(frame);if(document.hidden||now-last<1000/18)return;const dt=Math.min((now-(last||now))/1000,.1);last=now;
 if(!state.paused)time+=dt;
 const active=state.mode!=='waiting';activation+=(Number(active)-activation)*.2;
 const target=state.mode==='audio' && settings.reactive ? (state.paused?.35:(.12+.5*Math.pow(Math.max(0,Math.sin(time*5.3)),2))):0;
 envelope+=(Math.min(1,target*settings.sensitivity/100)-envelope)*.3;
 if(particleKinds.includes(study.kind))particles.step(dt,clamp(Math.max(0,(envelope-.06)/.48)*settings.motion),active);else particles.kind="";
 study.eyes.forEach((c,i)=>{eyeFrame(study,i);c.style.opacity=settings.brightness/100;});}
requestAnimationFrame(frame);
