name: Yorick
options:
  bundleIdPrefix: com.heyyorick
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.6.0"

targets:
  Yorick:
    type: application
    platform: macOS
    sources:
      - path: Yorick
        excludes:
          - Resources
      - path: Yorick/Resources/YorickEyePreview.html
        buildPhase: resources
      - path: Yorick/Resources/Assets.xcassets
        buildPhase: resources
      - path: Yorick/Resources/Whisper
        type: folder
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyyorick.Yorick
        PRODUCT_NAME: Yorick
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "12"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QFVQCASSH2
        CODE_SIGN_IDENTITY: Apple Development
        INFOPLIST_FILE: Yorick/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Yorick/Resources/Yorick.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        # Hardware lab: Damian's wired mics (the USB serial / 2.4 GHz receiver
        # control path and wired-skull matching). On in Debug, off in Release,
        # so public builds carry only the Bluetooth devices, eye settings included.
        # dev-install.sh turns it back on with YORICK_HARDWARE_LAB=YES.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(YORICK_LAB_CONDITION_$(YORICK_HARDWARE_LAB))"
        YORICK_LAB_CONDITION_YES: YORICK_HARDWARE_LAB
      configs:
        Debug:
          YORICK_HARDWARE_LAB: YES
        Release:
          YORICK_HARDWARE_LAB: NO

  # Logic tests only: compiles the pure Stage-0 sources directly instead of
  # hosting the app, so tests need no signing entitlements, permissions, or
  # app launch. Add pure files here as they grow test coverage.
  YorickTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: YorickTests
      - path: Yorick/Config/YorickMicController.swift
      - path: Yorick/Config/AudioVisualLevel.swift
      - path: Yorick/Config/PocketBluetoothProtocol.swift
      - path: Yorick/Config/OpusPacketDecoder.swift
      - path: Yorick/Config/SkullBluetoothProtocol.swift
      - path: Yorick/Config/SkullMiniBluetoothProtocol.swift
      - path: Yorick/Config/DeviceBattery.swift
      - path: Yorick/Config/BluetoothCallMonitor.swift
      - path: Yorick/Config/YorickDeviceKind.swift
      - path: Yorick/Capture/AudioInputMeter.swift
      - path: Yorick/Config/YorickEyeSettings.swift
      - path: Yorick/Output/SpokenFormNormalizer.swift
      - path: Yorick/Output/Vocabulary.swift
      - path: Yorick/Output/FieldProfiler.swift
      - path: Yorick/Capture/FocusClassifier.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyyorick.YorickTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QFVQCASSH2
        SWIFT_STRICT_CONCURRENCY: complete
        # Lab sources are compiled in directly; test them in Debug only.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(YORICK_LAB_CONDITION_$(YORICK_HARDWARE_LAB))"
        YORICK_LAB_CONDITION_YES: YORICK_HARDWARE_LAB
      configs:
        Debug:
          YORICK_HARDWARE_LAB: YES
        Release:
          YORICK_HARDWARE_LAB: NO

schemes:
  Yorick:
    build:
      targets:
        Yorick: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YorickTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
