name: Yorick
options:
  bundleIdPrefix: com.heyyorick
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.6.0"

targets:
  Yorick:
    type: application
    platform: macOS
    sources:
      - path: Yorick
        excludes:
          - Resources
      - path: Yorick/Resources/Assets.xcassets
        buildPhase: resources
      - path: Yorick/Resources/Whisper
        type: folder
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyyorick.Yorick
        PRODUCT_NAME: Yorick
        MARKETING_VERSION: "0.2.3"
        CURRENT_PROJECT_VERSION: "9"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JD2ZUW2N95
        CODE_SIGN_IDENTITY: Apple Development
        INFOPLIST_FILE: Yorick/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Yorick/Resources/Yorick.entitlements
        SWIFT_STRICT_CONCURRENCY: complete

  # Logic tests only: compiles the pure Stage-0 sources directly instead of
  # hosting the app, so tests need no signing entitlements, permissions, or
  # app launch. Add pure files here as they grow test coverage.
  YorickTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: YorickTests
      - path: Yorick/Output/SpokenFormNormalizer.swift
      - path: Yorick/Output/FieldProfiler.swift
      - path: Yorick/Capture/FocusClassifier.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyyorick.YorickTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JD2ZUW2N95
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  Yorick:
    build:
      targets:
        Yorick: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YorickTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
